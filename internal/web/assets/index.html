<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лазейка</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <div class="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="5" y="4" width="5" height="24" rx="1.5"/>
        <rect x="22" y="4" width="5" height="24" rx="1.5"/>
        <path d="M2 23 C 10 23, 12 10, 30 9" class="brand-path"/>
      </svg>
      <span>Лазейка</span>
    </div>
    <section class="qp" id="qp" aria-label="Включение VPN и zapret"></section>
    <nav class="side-nav" aria-label="Разделы">
      <button class="nav" data-tab="home" aria-current="page"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="18.5" r="2.2"/><circle cx="18.5" cy="5.5" r="2.2"/><path d="M7.7 18.5H15a3.2 3.2 0 0 0 0-6.4H9a3.2 3.2 0 0 1 0-6.4h7.3"/></svg><span class="nav-label">Маршрут</span></button>
      <button class="nav" data-tab="servers"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></svg><span class="nav-label">Серверы</span></button>
      <button class="nav" data-tab="rules"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6H20M9.5 12H20M9.5 18H20"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span class="nav-label">Правила</span></button>
      <button class="nav" data-tab="zapret"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l7 2.8v5.3c0 4.3-2.9 8-7 9.5-4.1-1.5-7-5.2-7-9.5V6z"/><path d="M9 12.2l2.2 2.2 4-4.4"/></svg><span class="nav-label">zapret</span></button>
      <button class="nav" data-tab="settings"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="nav-label">Настройки</span></button>
      <button class="nav" data-tab="log"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h8l4 4v13h-12z"/><path d="M14 3.5V8h4.5"/><path d="M9.5 12.5h6M9.5 16.5h6"/></svg><span class="nav-label">Журнал</span></button>
    </nav>
    <div class="side-foot" id="side-foot"></div>
  </div>
  <main id="main">
    <div id="jobs" class="jobs" hidden></div>
    <section id="tab-home" class="tab"></section>
    <section id="tab-servers" class="tab" hidden></section>
    <section id="tab-rules" class="tab" hidden></section>
    <section id="tab-zapret" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
    <section id="tab-log" class="tab" hidden></section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file-input" accept=".conf,.json,.txt,.yaml,.yml" hidden>
<script src="app.js"></script>
</body>
</html>
